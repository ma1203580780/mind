 <path class="sc-cloud sc-cloud--front" fill="url(#sc-front)" d="M-70 469C28 449 91 425 152 441C205 414 259 439 302 461C369 451 435 480 481 489C554 481 600 511 669 520C794 541 902 530 987 512C1051 513 1107 484 1161 482C1223 454 1292 456 1333 466C1393 435 1466 437 1513 453C1566 427 1625 446 1670 450V570H-70Z"/>
 <path fill="url(#sc-haze)" d="M0 430H1600V540H0Z"/>
</svg>
