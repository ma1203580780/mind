<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" preserveAspectRatio="none" fill="none" aria-hidden="true" focusable="false">
 <defs>
  <linearGradient id="sc-distance" x1="0" y1="310" x2="0" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="var(--sky-cloud-light, #fff)" stop-opacity=".68"/><stop offset="1" stop-color="var(--sky-cloud-distance, #eaf6fd)" stop-opacity=".25"/></linearGradient>
  <linearGradient id="sc-middle" x1="0" y1="350" x2="0" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="var(--sky-cloud-light, #fff)" stop-opacity=".92"/><stop offset=".65" stop-color="var(--sky-cloud-shade, #e1f1fb)" stop-opacity=".65"/><stop offset="1" stop-color="var(--sky-cloud-light, #fff)"/></linearGradient>
  <linearGradient id="sc-front" x1="0" y1="425" x2="0" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="var(--sky-cloud-front, #f7fbfe)"/><stop offset="1" stop-color="var(--sky-cloud-light, #fff)"/></linearGradient>
  <linearGradient id="sc-haze" x1="0" y1="430" x2="0" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="var(--sky-cloud-floor, #f8f8f7)" stop-opacity="0"/><stop offset=".7" stop-color="var(--sky-cloud-floor, #f8f8f7)" stop-opacity=".8"/><stop offset="1" stop-color="var(--sky-cloud-floor, #f8f8f7)"/></linearGradient>
  <linearGradient id="sc-wisp" x1="0" x2="1"><stop stop-color="var(--sky-cloud-light, #fff)" stop-opacity="0"/><stop offset=".45" stop-color="var(--sky-cloud-light, #fff)" stop-opacity=".6"/><stop offset="1" stop-color="var(--sky-cloud-light, #fff)" stop-opacity="0"/></linearGradient>
  <filter id="sc-soft" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
 </defs>
 <!-- Thin, asymmetric wisps frame an entirely open title area. -->
 <g class="sc-cloud sc-cloud--wisps" fill="url(#sc-wisp)" filter="url(#sc-soft)" opacity=".65">
  <path d="M-80 126C-9 122 15 104 76 108C131 82 163 91 202 105C237 111 274 112 306 118C244 135 153 141 73 136C9 134-29 136-80 126Z"/>
  <path d="M1250 176C1320 167 1372 149 1416 155C1456 129 1497 141 1528 150C1580 152 1627 161 1690 169C1544 192 1393 189 1250 176Z"/>
 </g>
 <!-- Broad contours sit low; fine curvature replaces repeated round humps. -->
