name: Publish blog
on:
  push:
    branches: [main]
  # GitHub 的 schedule 是尽力而为：实测会晚几小时、也会漏跑（一天 3 次大约命中一半）。
  # 所以排得多一些（每 3 小时两个点，共 16 次机会），再用下面的新鲜度门控决定是否真采集：
  # 只有距上次采集 ≥ 6 小时才付出采集与翻译的成本，其余运行只做构建部署（约 45 秒）。
  # 这样每天实际采集 2–4 次，而定时机会多了 5 倍。
  schedule:
    - cron: '7,37 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/translation-requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mind-translation
          key: mind-argos-en-zh-1.9-433e7c4f
      - name: Check news freshness
        id: news
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[collect-news]') }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
            echo "手动触发或提交信息含 [collect-news]：本次强制采集"
            exit 0
          fi
          age=$(python3 - <<'PY'
          import datetime, json, pathlib
          p = pathlib.Path('src/data/news-status.json')
          if not p.exists():
              print(9999)
          else:
              t = datetime.datetime.fromisoformat(json.loads(p.read_text())['checkedAt'])
              now = datetime.datetime.now(datetime.timezone.utc)
              print(int((now - t).total_seconds() // 3600))
          PY
          )
          echo "距上次采集 ${age} 小时（阈值 6）"
          if [ "$age" -ge 6 ]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install offline translation runtime
        if: steps.news.outputs.collect == 'true'
        run: pip install -r scripts/translation-requirements.txt
      - name: Collect public news feeds
        if: steps.news.outputs.collect == 'true'
        run: python3 scripts/collect-news.py
      - name: Enrich bilingual excerpts and publisher images
        if: steps.news.outputs.collect == 'true'
        run: python3 scripts/enrich-news.py
      - run: python3 -m unittest discover -s scripts -p 'test_*news.py'
      - run: npm ci
      - run: npm run test:writing
      - run: npm run test:news
      - run: node --test scripts/discovery.test.mjs scripts/navigation.test.mjs
      - run: node --test scripts/analytics.test.mjs
      - name: Refresh public GitHub projects
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: node --test scripts/reading-articles.test.mjs scripts/site-presentation.test.mjs scripts/sky-background.test.mjs scripts/search-position.test.mjs scripts/pool-background.test.mjs
      - run: npm run test:v2
      - name: Save collected editions
        if: steps.news.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/news src/data/news-status.json src/data/news-enrichment-cache.json src/data/github-projects.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update sourced AI and economics news'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
