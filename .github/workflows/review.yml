name: Review build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s scripts -p 'test_*news.py'
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: node --test scripts/*.test.mjs
